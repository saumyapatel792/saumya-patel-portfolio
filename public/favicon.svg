<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b0f19" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Stylized 'S' Node Path -->
  <path d="M68 32 C68 25, 32 23, 32 37 C32 50, 68 48, 68 63 C68 77, 32 75, 32 68" 
        stroke="url(#grad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <!-- Neural connection points -->
  <circle cx="68" cy="32" r="5" fill="#38bdf8" />
  <circle cx="32" cy="68" r="5" fill="#a855f7" />
  <circle cx="50" cy="50" r="3" fill="#6366f1" />
</svg>
